name: CI

# Cost/time optimization: the expensive legs (the macOS/Windows matrix and the
# `test-roms` accuracy battery) run only on release-class events -- push to the
# default branch, the merge queue, manual dispatch, a weekly drift-net cron, and
# `release/*` PRs -- and are SKIPPED on ordinary feature PRs, which get only the
# fast essential gates (fmt/clippy/rustdoc, the ubuntu unit tests, no_std). The
# full suite still runs on every merge to `main`, on release PRs, and weekly, so
# nothing ships unproven. See the `setup` job for the light/full decision.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:
  # Weekly drift safety-net: re-run the FULL suite on `main` so a regression
  # merged between releases is caught within a week regardless of cadence.
  schedule:
    - cron: "0 7 * * 1"

# Cancel superseded PR-branch runs (rapid pushes); let every other run finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Compute one "full-run" flag + the OS matrix. LIGHT (ubuntu-only, no
  # test-roms) for a regular feature PR; FULL (adds macOS/Windows + the
  # test-roms battery) for push-to-main, the merge queue, dispatch, the weekly
  # cron, and release/* PRs.
  setup:
    name: select matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      os: ${{ steps.pick.outputs.os }}
      full: ${{ steps.pick.outputs.full }}
      gpu: ${{ steps.pick.outputs.gpu }}
    steps:
      - id: pick
        shell: bash
        # Pass event/ref via env (NOT ${{ }} interpolation into run:) so a branch
        # name can't inject shell -- the actions/script-injection pattern CodeQL flags.
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [[ "$HEAD_REF" != release/* ]]; then
            full=false
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            full=true
            echo 'os=["ubuntu-latest", "macos-latest", "windows-latest"]' >> "$GITHUB_OUTPUT"
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

          # `gpu-rdp` is normally full-run only: it compiles ~35k lines of
          # vendored C++ and is the only job needing the submodule, so making
          # every feature PR pay for it would undo the light/full split. But a PR
          # that CHANGES the binding must not merge with that job never having
          # run -- the PR introducing it needed a manual `workflow_dispatch` to
          # get its own C++ built even once, which is precisely the
          # gate-that-never-runs shape this repo has been bitten by. So: full
          # runs, plus any PR touching the binding or its inputs.
          # This FAILS OPEN. If the file list cannot be fetched -- rate limit,
          # restricted token on a fork PR -- the job runs rather than being
          # skipped. A gate that quietly turns itself off when a side query
          # fails is worse than one that occasionally costs a C++ build: the
          # skip is invisible, and the whole reason this output exists is that
          # a silently-skipped gate already happened here once.
          gpu=$full
          if [ "$full" != "true" ] && [ -n "${PR_NUMBER:-}" ]; then
            if ! files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
                           --jq '.[].filename'); then
              echo "::warning::could not list changed files; running gpu-rdp rather than skipping it"
              gpu=true
            elif printf '%s\n' "$files" \
               | grep -qE '^(crates/rustyn64-rdp-gpu/|vendor/parallel-rdp-standalone|\.gitmodules$|\.github/workflows/ci\.yml$)'; then
              gpu=true
            fi
          fi
          echo "gpu=$gpu" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/linux-build-deps
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The maximal NATIVE feature set the `cargo full-build` alias uses. Identical
      # to `default` today (`full = ["default"]`), so this costs a cache hit -- but
      # the moment a feature is added to `full` and not to `default`, this is the
      # only job that would notice it stopped compiling.
      #
      # Debug, not the alias: `cargo full-build` is a `--release` build with
      # `lto = "fat"`, which is minutes on every PR to prove that a two-line config
      # entry expands correctly. The alias itself runs in the FULL-run leg below,
      # where that cost is already being paid.
      - run: cargo build -p rustyn64-frontend --features full
      # The ADR 0011 fast-path scheduler and its differential gate. Feature-gated
      # code is invisible to every other job here -- CI runs clippy exactly once
      # and never with this feature -- so without this step the gate would be a
      # gate that never runs, which is the failure mode `markdownlint` already
      # demonstrated in this repo.
      #
      # On the LIGHT leg on purpose: it is the test that grades the fast path, so
      # it has to run on the PRs that change it, not only on push-to-main.
      - run: cargo test -p rustyn64-core --features fast-scheduler
      - run: cargo clippy -p rustyn64-core --all-targets --features fast-scheduler -- -D warnings
      # The frontend forwards the feature, so the wiring in `run_frame` needs a
      # build too -- a `#[cfg]` arm that stops compiling is invisible to every job
      # that does not enable it.
      - run: cargo clippy -p rustyn64-frontend --all-targets --features fast-scheduler -- -D warnings
      # The ADR 0013 instruction-granular execution path and its CPU-level
      # differential gate. Same reasoning as `fast-scheduler` above, and the same
      # leg: it is the test that grades the fast execution mode, so it has to run
      # on the PRs that change it. A separate feature, not an extension of the
      # other one -- `fast-scheduler` is tick-identical and `fast-exec` is
      # deliberately not, so they are graded by different predicates.
      - run: cargo test -p rustyn64-cpu --features fast-exec
      - run: cargo clippy -p rustyn64-cpu --all-targets --features fast-exec -- -D warnings
      # And the core + frontend wiring. `run_frame` picks one of THREE entry
      # points by `cfg`, and an arm that stops compiling is invisible to every job
      # that does not enable its feature -- which is how a `#[cfg]` arm rots.
      - run: cargo test -p rustyn64-core --features fast-exec
      - run: cargo clippy -p rustyn64-core --all-targets --features fast-exec -- -D warnings
      - run: cargo clippy -p rustyn64-frontend --all-targets --features fast-exec -- -D warnings
      # Both features together is a DEFINED configuration (ADR 0013 section 1
      # settles the precedence), so it is built rather than left to chance.
      - run: cargo test -p rustyn64-frontend --features fast-exec
      - run: cargo check -p rustyn64-frontend --features fast-exec,fast-scheduler

  rustdoc:
    name: rustdoc (-D warnings)
    # Its OWN job, deliberately, for two reasons learned the hard way.
    #
    # 1. It used to be the LAST step of the `test` job, after the slow test run.
    #    That made it the most likely thing to be lost when a follow-up push
    #    canceled the run (`cancel-in-progress` below), and in practice a commit
    #    with a broken intra-doc link sailed through because the run was
    #    reported `cancelled` before rustdoc ever executed -- not because it passed.
    # 2. A rustdoc failure reported as "test (ubuntu-latest) failed", which
    #    points at the wrong thing. Now the job name says what broke.
    #
    # No `needs:`, so it starts immediately and finishes in well under a minute
    # -- fast enough to be genuinely useful feedback, and small enough that it is
    # rarely mid-flight when a supersede happens.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      # rustdoc builds the whole workspace including the frontend, so the
      # alsa/udev headers its build scripts need must be present.
      - uses: ./.github/actions/linux-build-deps
      # -D warnings turns every rustdoc lint into an error: broken intra-doc
      # links, public docs linking to private items, and missing docs on public
      # items (the workspace sets `missing_docs = "warn"`).
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  test-roms:
    name: test (test-roms feature)
    # The heavy accuracy-ROM battery -- FULL-run only (skipped on ordinary
    # feature PRs, runs on push-to-main / merge queue / dispatch / weekly cron /
    # release PRs). This is the single biggest per-PR time saving.
    needs: setup
    if: ${{ needs.setup.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/linux-build-deps
      # Assert the feature actually reached the harness rather than trusting the
      # exit code. A sibling project hit a Cargo feature-unification quirk where
      # this exact command exited 0 while silently never enabling `test-roms` for
      # its harness crate, so the ROM-oracle gate ran nothing and still reported
      # green. An oracle that runs zero tests looks identical to one that passes,
      # so the exit code cannot distinguish them -- only the probe can.
      # Run the alias the README tells people to use, rather than a hand-expanded
      # equivalent: an alias that has silently stopped resolving is exactly the kind
      # of thing nobody notices until they need it, and expanding it here by hand
      # would exercise everything about it except the part that can break.
      - run: cargo full-build
      # And `full-run`, whose trailing `--` is the part that can break. `--help` is
      # handled by the binary's own argv loop and exits before any window is opened,
      # so it proves the forwarding works on a headless runner.
      #
      # NOTE the absence of a second `--`: the alias already ends in one, so
      # `cargo full-run -- --help` passes a literal `--` through to the binary and
      # exits 2 on an unknown option. That is the forwarding working, and it is worth
      # recording, because writing the `--` out of habit is how this check would come
      # to fail for a reason unrelated to what it tests.
      - run: cargo full-run --help
      - name: Run the test-ROM battery, and prove the feature was on
        run: |
          set -euo pipefail
          cargo test --workspace --features test-roms 2>&1 | tee /tmp/test-roms.log
          if ! grep -q "probe_test_roms_feature_is_enabled ... ok" /tmp/test-roms.log; then
            echo "::error::the test-roms feature did not reach rustyn64-test-harness -- the battery ran nothing"
            exit 1
          fi
          echo "test-roms feature confirmed active in the harness"

  gpu-rdp:
    name: build (gpu-rdp feature)
    # Compiles the vendored parallel-rdp C++ (ADR 0014). Runs on a full run, and
    # on any PR that touches the binding -- see the `gpu` output in `setup` for
    # why the second half matters.
    #
    # It BUILDS but does not render. A GitHub runner has no GPU, so the smoke
    # test takes its documented no-device branch. That is still worth running:
    # it proves the shim links, the `extern "C"` signatures match, and the
    # library loads -- and the step below asserts which branch was taken rather
    # than letting "0 failed" stand in for "it worked". An untested feature is
    # the gate-that-never-runs failure this project has been bitten by before;
    # a test whose skip is silent is the same failure wearing a green tick.
    needs: setup
    if: ${{ needs.setup.outputs.gpu == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p rustyn64-rdp-gpu --all-targets --features gpu-rdp -- -D warnings
      - run: cargo clippy -p rustyn64-test-harness --all-targets --features gpu-rdp -- -D warnings
      - name: Run the smoke test and report which branch it took
        run: |
          set -euo pipefail
          cargo test -p rustyn64-rdp-gpu --features gpu-rdp -- --nocapture 2>&1 \
            | tee /tmp/gpu-rdp.log
          if grep -q "^SKIPPED" /tmp/gpu-rdp.log; then
            echo "::notice::no Vulkan device on this runner -- the binding built and linked, but nothing about rendering was verified here"
          elif grep -q "fill color occupies" /tmp/gpu-rdp.log; then
            echo "a real frame was rendered and checked"
          else
            echo "::error::the smoke test neither rendered nor reported a skip; it is no longer witnessing either outcome"
            exit 1
          fi
      - name: Run the .rvec parity census and report which branch it took
        run: |
          set -euo pipefail
          cargo test -p rustyn64-test-harness --features gpu-rdp \
            --test rdp_conformance_gpu -- --nocapture 2>&1 | tee /tmp/gpu-parity.log
          if grep -q "^SKIPPED" /tmp/gpu-parity.log; then
            echo "::notice::no Vulkan device on this runner -- GPU parity of the .rvec corpus was NOT verified here"
          elif grep -q "^graded .* vectors" /tmp/gpu-parity.log; then
            echo "the corpus was graded on both paths"
          else
            echo "::error::the parity census neither graded nor reported a skip"
            exit 1
          fi

  no_std:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Deliberately WITHOUT `submodules: true`, as in every job but `gpu-rdp`.
      # ADR 0014 promises a default build needs neither the submodule nor a C++
      # toolchain; these jobs are what make that a checked claim rather than an
      # intention.
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo build -p rustyn64-core --target thumbv7em-none-eabihf --no-default-features
      # And with the optional fast-path scheduler on. An additive feature that
      # quietly pulled in `std` would still pass every other job here, because
      # nothing else builds this crate for a bare-metal target -- so the no_std
      # claim for `fast-scheduler` is only true if it is checked here.
      - run: cargo build -p rustyn64-core --target thumbv7em-none-eabihf --no-default-features --features fast-scheduler
      # And the CPU crate with the instruction-granular path on. `fastexec` is a
      # child module of `pipeline` and uses nothing beyond what the accurate path
      # already does, but "uses nothing" is a claim, and this is what checks it.
      - run: cargo build -p rustyn64-cpu --target thumbv7em-none-eabihf --no-default-features --features fast-exec
      - run: cargo build -p rustyn64-core --target thumbv7em-none-eabihf --no-default-features --features fast-exec

  no-commercial-roms:
    name: no commercial ROMs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Layer 3 of the ROM guard (see .gitignore and the pre-commit hook).
      # Server-side and unskippable: a contributor can bypass the local hook
      # with --no-verify, but not this. Scans the whole tracked tree, so it
      # also catches a ROM that slipped in via an earlier commit.
      - run: bash scripts/check_no_roms.sh

  en-us-spelling:
    name: en-US spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # In CI, not pre-commit only. A one-off spelling sweep decays because
      # nothing fails when a single en-GB form comes back, so it survives review
      # and the next one has precedent. This repo already has evidence of the
      # pattern: markdownlint runs only in pre-commit, and an MD040 violation
      # consequently sat unnoticed on main. Excludes the immutable/vendored
      # trees; see the script header for the list and the reasons.
      - run: bash scripts/check_en_us.sh

  microcode-blob:
    name: microcode blob integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Read-only job: it only checks committed files, so it needs no persisted
      # git credential (clears zizmor's `artipacked` warning). SHA-pinning the
      # action is deliberately left to a repo-wide hardening pass — every job in
      # this workflow uses `@v7`, and pinning one in isolation is inconsistent.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The vendored rdpq microcode is committed as a generated blob (assembled
      # from third_party/libdragon-rsp/ with the mips64-elf toolchain). This
      # toolchain-free gate catches a corrupted or hand-edited blob by checking
      # it against its committed checksum. Full source->blob reassembly is the
      # local assemble.sh step (see third_party/libdragon-rsp/NOTICE.md).
      - run: bash scripts/check_microcode_blob.sh

  no-conflict-markers:
    name: no conflict markers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # A `|||||||` diff3 marker was once committed into CHANGELOG.md and would
      # have shipped into the release notes: the resolution handled the three
      # familiar markers but not the diff3 middle section, and a stray line is
      # valid Markdown so nothing downstream complained.
      - run: bash scripts/check_no_conflict_markers.sh

  wasm-bindgen-pin:
    name: trunk pin matches Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Trunk resolves the wasm-bindgen CLI from its own pin, which must equal
      # the wasm-bindgen LIBRARY version cargo resolved. A mismatch fails the
      # wasm build at bindgen time -- but nothing else notices, so the pin drifts
      # silently on any dependency bump that moves wasm-bindgen. This is the
      # cheap guard: no toolchain, no network, just the two numbers.
      - name: Compare Trunk.toml pin against Cargo.lock
        run: |
          set -euo pipefail
          trunk_toml=crates/rustyn64-frontend/web/Trunk.toml
          lock=$(python3 - <<'PY'
          import re
          for blk in open("Cargo.lock").read().split("[[package]]"):
              if re.search(r'name = "wasm-bindgen"\s*$', blk, re.M):
                  print(re.search(r'version = "([^"]+)"', blk).group(1))
                  break
          PY
          )
          pin=$(grep -oP 'wasm_bindgen\s*=\s*"\K[^"]+' "$trunk_toml")
          echo "Cargo.lock wasm-bindgen : $lock"
          echo "Trunk.toml  wasm_bindgen: $pin"
          if [ "$lock" != "$pin" ]; then
            echo "::error file=$trunk_toml::wasm_bindgen pin $pin != Cargo.lock $lock -- update the pin"
            exit 1
          fi
          echo "pin matches"
